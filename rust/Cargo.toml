[package]
name = "imutq"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"

[lib]
name = "imutq"
crate-type = ["rlib", "cdylib"]
path = "src/lib.rs"

[dependencies]
sha3 = "0.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
fips204 = { version = "0.5.0", default-features = false, features = ["ml-dsa-44"] }
base64 = "0.23.1"

[[bin]]
name = "imutq"
path = "src/main.rs"
